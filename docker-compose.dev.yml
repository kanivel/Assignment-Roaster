# docker-compose.dev.yml - development overrides (hot reload, bind mounts)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    # Loopback only: dev Postgres uses the default password.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    # The Vite dev server calls the API directly, so publish it (loopback only).
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    # Use the Vite dev server directly instead of the nginx production image.
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: !override
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      disable: true
    depends_on: !override
      backend:
        condition: service_started

volumes:
  frontend_node_modules:
