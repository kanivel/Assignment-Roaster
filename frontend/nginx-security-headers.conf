# frontend/nginx-security-headers.conf
# Security headers for the SPA. nginx `add_header` is NOT inherited by a location
# that declares its own add_header, so this file is `include`d at server level AND
# in every location that adds headers of its own (see nginx.conf).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Emotion/Chakra inject <style> tags, hence 'unsafe-inline' for styles only.
# connect-src 'self' assumes the API is reached via the /api/ proxy below
# (VITE_API_URL empty); add the API origin here if that ever changes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
