# frontend/nginx.conf
# Serves the Vite SPA and proxies API calls to the FastAPI backend container.
# Security headers live in /etc/nginx/snippets/security-headers.conf and are
# included in every block that declares its own add_header (nginx does not
# inherit add_header across levels once a location sets one).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers (inherited by locations without their own add_header, e.g. /api/)
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed static assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy API requests to the backend service (so VITE_API_URL can be empty)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
